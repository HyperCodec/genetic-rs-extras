[package]
name = "genetic-rs-extras"
version = "0.1.0"
edition = "2024"
authors = ["HyperCodec"]
license = "MIT"
description = "Extra utilities for genetic-rs, including plotting and progress bars."
categories = ["simulation", "visualization", "algorithms"]
keywords = ["genetic-algorithms", "evolution", "plotting", "progress-bars"]
homepage = "https://github.com/HyperCodec/genetic-rs-extras"
repository = "https://github.com/HyperCodec/genetic-rs-extras"
documentation = "https://docs.rs/genetic-rs-extras"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
plotters = ["dep:plotters"]
indicatif = ["dep:indicatif"]

[[example]]
name = "all"
path = "examples/all.rs"
required-features = ["genetic-rs/derive"]

[dependencies]
genetic-rs = "1.3.0"
indicatif = { version = "0.18.4", optional = true }
plotters = { version = "0.3.7", optional = true }